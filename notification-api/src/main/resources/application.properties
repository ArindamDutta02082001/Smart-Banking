spring.application.name=notification-api
spring.config.import=configserver:
spring.cloud.config.uri=http://localhost:8888/config-server
server.port=8003

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id= notificationId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.royal.reserve.bank.notification.api.event.TransactionEvent
